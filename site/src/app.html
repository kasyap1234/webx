<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- page title lives in +page.svelte svelte:head — a static one here would duplicate -->
		<meta
			name="description"
			content="Scrape, search, crawl, index, extract, and verify — one static binary instead of three API bills. MIT licensed. Zero required services."
		/>
		<meta name="theme-color" content="#F5F2EC" />
		<meta property="og:title" content="webx — the web toolkit for AI coding agents" />
		<meta
			property="og:description"
			content="One static binary instead of three API bills. MIT licensed. Zero required services."
		/>
		<meta property="og:type" content="website" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
		<noscript>
			<style>
				.reveal {
					opacity: 1 !important;
					transform: none !important;
					filter: none !important;
				}
			</style>
		</noscript>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

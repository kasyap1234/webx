name: publish-sdks

# Tag a release → SDKs ship. Each job is gated on a repo variable so the
# release goes green before the registry accounts exist — flip the switch
# once configured (see docs/LAUNCH.md):
#   gh variable set PYPI_ENABLED --body true   # after PyPI trusted publishing is set up
#   gh variable set NPM_ENABLED --body true    # after `gh secret set NPM_TOKEN`
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    if: vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing — no API token to leak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Version from the tag keeps pyproject.toml honest — bump it in the
      # package before tagging or this step refuses to diverge.
      - name: build
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    if: vars.NPM_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: publish
        working-directory: sdk/javascript
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

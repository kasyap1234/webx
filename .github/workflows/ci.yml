name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/webx ./cmd/webxd

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python -m py_compile sdk/python/webx_sdk/*.py
      - run: cd sdk/python && pip install . && python -c "import webx_sdk; print(webx_sdk.__version__)"
      - run: node --check sdk/javascript/src/index.js

  # openapi.json stays generator-consumable — every spec edit is proven
  # against real client generation for the long-tail languages.
  gen-sdks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [rust, ruby, java]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/gen-sdks.sh ${{ matrix.lang }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # buildx container driver — multi-platform builds + SBOM attestation
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Bump the source-build formula in the tap — kept out of goreleaser since
  # it only generates casks, and cask'd binaries hit Gatekeeper quarantine.
  tap-formula:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: bump Formula/webx.rb
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHA=$(curl -fsSL "https://github.com/kasyap1234/webx/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/kasyap1234/homebrew-tap.git" tap
          cd tap
          sed -i "s|refs/tags/v[^/]*\.tar\.gz|refs/tags/${TAG}.tar.gz|; s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/webx.rb
          git config user.name "webx-bot"
          git config user.email "bot@kasyap1234.github.io"
          git add Formula/webx.rb
          if git diff --cached --quiet; then echo "formula already current"; exit 0; fi
          git commit -m "webx ${TAG}"
          git push

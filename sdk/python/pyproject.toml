[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webx"
version = "0.1.0"
description = "Python SDK for webx — the open-source web toolkit for AI agents (scrape, crawl, search, extract)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kasyap", email = "kasyap1234@gmail.com"}]
keywords = ["scraping", "crawling", "agents", "llm", "markdown", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []  # zero-dep — stdlib urllib only

[project.urls]
Homepage = "https://github.com/kasyap1234/webx"
Repository = "https://github.com/kasyap1234/webx"

[tool.setuptools.packages.find]
include = ["webx*"]

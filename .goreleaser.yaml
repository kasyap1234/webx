# Goreleaser — `goreleaser release` on a git tag builds all binaries for
# every agent-platform arch. Chrome stays optional at runtime (never bundled).
version: 2

builds:
  - id: webx
    main: ./cmd/webx
    binary: webx
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: webxd
    main: ./cmd/webxd
    binary: webxd
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: webxl
    main: ./cmd/webxl
    binary: webxl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

# One archive per binary — webx ships windows too, webxd/webxl don't;
# a shared archive block would mismatch binary counts per platform.
archives:
  - id: webx
    ids: [webx]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files: [README.md, LICENSE, llms.txt]
  - id: webxd
    ids: [webxd]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    files: [README.md, LICENSE, llms.txt]
  - id: webxl
    ids: [webxl]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    files: [README.md, LICENSE, llms.txt]

checksum:
  name_template: "checksums.txt"

# dockers_v2 — one buildx build pushes a multi-arch manifest straight to
# ghcr. The context layout is $TARGETPLATFORM/ containing the matched
# binaries, which is what Dockerfile.release copies.
dockers_v2:
  - ids: [webx, webxd]
    dockerfile: Dockerfile.release
    images: ["ghcr.io/kasyap1234/webx"]
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]

# Homebrew cask → brew install --cask kasyap1234/tap/webx.
# Needs HOMEBREW_TAP_TOKEN (contents:write on kasyap1234/homebrew-tap).
homebrew_casks:
  - repository:
      owner: kasyap1234
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      branch: main
    ids: [webx]
    binaries: [webx]
    description: "The web toolkit for AI coding agents — scrape, search, crawl, extract"
    homepage: "https://github.com/kasyap1234/webx"
    license: MIT

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "merge"]
